# Auto-merge Dependabot PRs for patch and minor updates.
#
# IMPORTANT: for this to be SAFE and to actually work, the repository
# settings must be configured as follows:
#   1. Settings -> General -> "Allow auto-merge" must be ENABLED.
#      (`gh pr merge --auto` only queues the merge; GitHub performs it
#      once all required checks pass.)
#   2. Branch protection on `main` must REQUIRE the CI workflow's
#      "Lint and build" check to pass. Without a required status check,
#      auto-merge would merge PRs immediately, before CI has run.
#
# Major version updates are never auto-merged and remain open for
# manual review.

name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge for patch/minor updates
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash)
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

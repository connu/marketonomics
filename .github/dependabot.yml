# Dependabot opens update PRs; a human reviews and merges them.
# Auto-merge was removed deliberately — do not re-add a workflow that calls
# `gh pr merge --auto`. Dependency bumps land only via manual approval.

version: 2
updates:
  # Weekly npm dependency updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # All minor and patch updates land together in a single PR
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Major updates fall outside the group above, so each major
    # version bump gets its own PR for individual review.

  # Keep GitHub Actions versions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
